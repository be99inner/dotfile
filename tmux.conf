# ============================================================================
# Core
# ============================================================================

# Use C-a as the tmux prefix and keep C-a available for nested tmux sessions.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color support for modern terminals and Neovim.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# Make tmux feel responsive and keep enough scrollback for long-running tasks.
set -sg escape-time 0
set -g repeat-time 600
set -g history-limit 100000
set -g focus-events on

# Stable indexing and window behavior.
set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g detach-on-destroy off
set -g set-clipboard on
set -g mouse on

# Quiet terminal bells.
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity off

# Vi-style copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# ============================================================================
# Key Bindings
# ============================================================================

# Reload configuration quickly while editing this file.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Create windows and panes in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Easier pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-like window navigation.
bind -r C-h previous-window
bind -r C-l next-window

# Fast session/window pickers.
bind s choose-tree -sZ
bind w choose-tree -wZ


# ============================================================================
# Status Line
# ============================================================================

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 120
set -g status-style "fg=colour248,bg=colour234"
set -g status-left "#[fg=colour81,bold] #S #[fg=colour240]#{prefix_highlight} "
set -g status-right "#[fg=colour240]%Y-%m-%d #[fg=colour81]%H:%M "

setw -g window-status-format " #[fg=colour244]#I:#W "
setw -g window-status-current-format " #[fg=colour81,bold]#I:#W "

# Show each pane's current foreground program in its border.
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "


# ============================================================================
# Plugins
# ============================================================================

# Plugin manager.
set -g @plugin "tmux-plugins/tpm"

# Small, safe defaults similar to vim-sensible.
set -g @plugin "tmux-plugins/tmux-sensible"

# Clipboard integration for keyboard and mouse selections.
set -g @plugin "tmux-plugins/tmux-yank"

# Open highlighted files and URLs from copy mode.
set -g @plugin "tmux-plugins/tmux-open"

# Better search helpers in copy mode.
set -g @plugin "tmux-plugins/tmux-copycat"

# Save and restore tmux sessions.
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Seamless pane navigation between tmux and Vim/Neovim.
set -g @plugin "christoomey/vim-tmux-navigator"

# Shows whether the prefix key is currently active.
set -g @plugin "tmux-plugins/tmux-prefix-highlight"


# ============================================================================
# Plugin Options
# ============================================================================

# tmux-yank: copy selections to the system clipboard.
set -g @yank_selection "clipboard"
set -g @yank_selection_mouse "clipboard"
set -g @yank_action "copy-pipe-and-cancel"
set -g @yank_with_mouse on

# tmux-copycat: keep search motion close to Vim's n/N behavior.
set -g @copycat_next "n"
set -g @copycat_prev "N"

# tmux-resurrect/continuum: keep tmux sessions recoverable without auto-starting tmux.
set -g @continuum-save-interval "15"
set -g @continuum-restore "off"
set -g @resurrect-capture-pane-contents "on"

# tmux-prefix-highlight: used by status-left above.
set -g @prefix_highlight_show_copy_mode "on"
set -g @prefix_highlight_copy_mode_attr "fg=colour222,bold"
set -g @prefix_highlight_prefix_prompt " PREFIX"
set -g @prefix_highlight_copy_prompt " COPY"


# ============================================================================
# TPM
# ============================================================================

# Keep TPM initialization last so plugin options above are available on startup.
run -b "~/.tmux/plugins/tpm/tpm"
